<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Барс и Пик Олимпиады</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700;800&family=Nunito:wght@500;700;800;900&display=swap" rel="stylesheet">
<style>
/* Игра-приключение: карта миров (как тропа Duolingo) → битвы с монстрами-Путаниками за ответы (как Prodigy) → награды, лавка, профиль. Единый яркий мир, светлая тема. */
:root{
  --sky1:#bfe3ff; --sky2:#eaf6ff; --card:#ffffff; --ink:#1d2b3a; --muted:#5f7184; --line:#d6e2ec;
  --blue:#2f7fd1; --blue-d:#1f5f9f; --gold:#ffb72b; --gold-d:#e2950a; --green:#3cb36b; --green-d:#2a8a50;
  --red:#ef5160; --red-d:#c73442; --purple:#7a5cff;
  --display:"Unbounded","Arial Black",system-ui,sans-serif; --body:"Nunito","Segoe UI",system-ui,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{font-family:var(--body);color:var(--ink);background:linear-gradient(180deg,var(--sky1),var(--sky2) 420px,#f6fbff);font-size:17px;line-height:1.45;overscroll-behavior-y:none}
button{font-family:var(--body);font-size:16px;cursor:pointer;color:inherit;border:none;background:none}
button:focus-visible,input:focus-visible,summary:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
h1,h2,h3{font-family:var(--display);margin:0;line-height:1.2;text-wrap:balance}
[hidden]{display:none!important}
.app{max-width:520px;margin:0 auto;min-height:100%;display:flex;flex-direction:column}

/* --- кнопки в стиле игры (объёмные) --- */
.gbtn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:52px;padding:0 20px;border-radius:16px;font-weight:900;font-size:17px;text-transform:uppercase;letter-spacing:.03em;transition:transform .08s}
.gbtn:active{transform:translateY(3px)}
.gbtn.blue{background:var(--blue);color:#fff;box-shadow:0 5px 0 var(--blue-d)}
.gbtn.green{background:var(--green);color:#fff;box-shadow:0 5px 0 var(--green-d)}
.gbtn.gold{background:var(--gold);color:#4a2c00;box-shadow:0 5px 0 var(--gold-d)}
.gbtn.red{background:var(--red);color:#fff;box-shadow:0 5px 0 var(--red-d)}
.gbtn.white{background:#fff;color:var(--blue);box-shadow:0 5px 0 var(--line);border:2px solid var(--line)}
.gbtn:disabled{filter:grayscale(1);opacity:.6}
.gbtn.wide{width:100%}

/* --- HUD --- */
.hud{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:10px;padding:10px 14px;background:rgba(255,255,255,.88);backdrop-filter:blur(8px);border-bottom:2px solid var(--line)}
.hud .ava{width:44px;height:44px;border-radius:50%;background:var(--sky1);border:3px solid var(--blue);overflow:hidden;position:relative;flex:none}
.hud .ava svg{width:56px;height:70px;position:absolute;left:-9px;top:-4px}
.hud .lv{flex:1;min-width:0}
.hud .lv b{font-family:var(--display);font-size:13px}
.xpbar{height:10px;border-radius:9px;background:var(--line);overflow:hidden;margin-top:3px}
.xpbar i{display:block;height:100%;background:linear-gradient(90deg,var(--purple),#a68bff);border-radius:9px;transition:width .6s}
.pill{display:flex;align-items:center;gap:4px;font-weight:900;font-size:16px;background:#fff;border:2px solid var(--line);border-radius:99px;padding:3px 10px;font-variant-numeric:tabular-nums}
.pill .ic{font-size:17px}
.coin{display:inline-block;width:18px;height:18px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fff3c4,var(--gold) 55%,var(--gold-d));border:2px solid #c98200;vertical-align:-3px}

/* --- нижняя навигация --- */
.tabs{position:sticky;bottom:0;z-index:20;display:grid;grid-template-columns:repeat(4,1fr);background:#fff;border-top:2px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom))}
.tabs button{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;border-radius:14px;font-weight:800;font-size:12px;color:var(--muted)}
.tabs button .ti{font-size:24px;line-height:1;filter:grayscale(.6);transition:transform .2s}
.tabs button[aria-current="true"]{color:var(--blue);background:#eaf4ff}
.tabs button[aria-current="true"] .ti{filter:none;transform:scale(1.15)}
main{flex:1;padding:14px 14px 30px;display:flex;flex-direction:column;gap:14px}

/* --- персонажи и анимации --- */
.hero-svg{overflow:visible}
.hero-svg .h-all{animation:bob 2.6s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}
.hero-svg .h-eyes{animation:blink 4.5s infinite;transform-box:fill-box;transform-origin:center}
.hero-svg .h-tail{animation:wag 1.8s ease-in-out infinite;transform-box:fill-box;transform-origin:0% 100%}
.hero-svg .h-arm{transform-box:fill-box;transform-origin:50% 10%}
.cheer .h-all{animation:jump .9s ease-out 2}
.cheer .h-arm.r{animation:wave .45s ease-in-out 4}
.sad .h-all{animation:sadtilt 1.2s ease-in-out}
.pet{animation:petbob 2s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}
@keyframes bob{0%,100%{transform:translateY(0) scale(1,1)}50%{transform:translateY(-3px) scale(1.02,.98)}}
@keyframes blink{0%,93%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
@keyframes wag{0%,100%{transform:rotate(0)}50%{transform:rotate(12deg)}}
@keyframes jump{0%{transform:translateY(0)}30%{transform:translateY(-26px) rotate(-6deg)}55%{transform:translateY(0) scale(1.08,.92)}75%{transform:translateY(-8px)}100%{transform:translateY(0)}}
@keyframes wave{0%,100%{transform:rotate(0)}50%{transform:rotate(-40deg)}}
@keyframes sadtilt{0%,100%{transform:rotate(0)}30%{transform:rotate(-8deg) translateY(3px)}60%{transform:rotate(6deg)}}
@keyframes petbob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
.mon-svg .m-body{animation:wobble 1.6s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}
.mon-svg .m-eyes{animation:blink 3.2s infinite;transform-box:fill-box;transform-origin:center}
.mon-svg .m-ant{animation:wag 1.2s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}
@keyframes wobble{0%,100%{transform:scale(1,1)}50%{transform:scale(1.06,.94)}}
.mon.hit{animation:hit .5s}
@keyframes hit{0%{transform:translateX(0);filter:none}15%{transform:translateX(10px);filter:brightness(2.2)}35%{transform:translateX(-9px)}55%{transform:translateX(6px);filter:brightness(1.4)}100%{transform:translateX(0);filter:none}}
.mon.attack{animation:attack .55s}
@keyframes attack{0%{transform:none}40%{transform:translate(-40px,30px) scale(1.15)}100%{transform:none}}
.mon.dead{animation:dead .9s forwards}
@keyframes dead{0%{transform:none;opacity:1}30%{transform:scale(1.2,.8)}100%{transform:scale(0) rotate(200deg);opacity:0}}
.shake{animation:shake .45s}
@keyframes shake{0%,100%{transform:none}20%{transform:translate(-8px,2px)}40%{transform:translate(7px,-2px)}60%{transform:translate(-5px,1px)}80%{transform:translate(3px,0)}}
@media (prefers-reduced-motion: reduce){*{animation-duration:.01ms!important;animation-iteration-count:1!important;transition:none!important}}

/* --- главная/карта --- */
.greet{display:grid;grid-template-columns:96px 1fr;gap:6px;align-items:end}
.greet svg{width:96px;height:120px}
.bubble{position:relative;background:#fff;border:3px solid var(--ink);border-radius:18px;padding:10px 14px;font-weight:800;font-size:16px;margin-bottom:22px;animation:pop .4s ease-out}
.bubble::after{content:"";position:absolute;left:-12px;bottom:12px;border:10px solid transparent;border-right-color:var(--ink);border-left:0}
@keyframes pop{0%{transform:scale(.6);opacity:0}70%{transform:scale(1.05)}100%{transform:scale(1);opacity:1}}
.quests{background:#fff;border:3px solid var(--line);border-radius:20px;padding:14px;display:flex;flex-direction:column;gap:10px}
.quests h3{font-size:15px;display:flex;justify-content:space-between;align-items:center}
.q-row{display:grid;grid-template-columns:1fr auto;gap:4px 10px;align-items:center;font-weight:800;font-size:15px}
.q-row .qb{grid-column:1/-1;height:12px;background:var(--line);border-radius:9px;overflow:hidden}
.q-row .qb i{display:block;height:100%;background:var(--gold);border-radius:9px;transition:width .5s}
.q-row.done{color:var(--green)}
.q-row.done .qb i{background:var(--green)}
.world{display:flex;flex-direction:column;align-items:center;gap:6px;margin-top:6px}
.wbanner{width:100%;border-radius:22px;padding:14px;display:grid;grid-template-columns:1fr 84px;gap:8px;color:#fff;box-shadow:0 6px 0 rgba(0,0,0,.15);position:relative;overflow:hidden}
.wbanner .wn{font-size:12px;font-weight:900;opacity:.9;text-transform:uppercase;letter-spacing:.06em}
.wbanner h2{font-size:18px;margin:2px 0 4px}
.wbanner p{margin:0 0 8px;font-size:14px;font-weight:700;opacity:.95}
.wbanner .mon-svg{width:84px;height:84px;align-self:center}
.wbanner .gbtn{min-height:40px;font-size:13px;padding:0 14px;background:rgba(255,255,255,.22);color:#fff;box-shadow:0 4px 0 rgba(0,0,0,.18)}
.path{position:relative;width:100%;display:flex;flex-direction:column;align-items:center;gap:18px;padding:18px 0 8px}
.node{position:relative;width:76px;height:70px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:var(--display);font-size:20px;color:#fff;background:var(--wc,#2f7fd1);box-shadow:0 7px 0 rgba(0,0,0,.22);transition:transform .1s}
.node:active{transform:translateY(4px);box-shadow:0 3px 0 rgba(0,0,0,.22)}
.node.locked{background:#cdd6df;color:#8da0b2}
.node.done{background:var(--gold);color:#5a3800}
.node.cur::before{content:"";position:absolute;inset:-9px;border-radius:50%;border:4px solid var(--wc,#2f7fd1);opacity:.6;animation:ring 1.6s ease-out infinite}
@keyframes ring{0%{transform:scale(.9);opacity:.7}100%{transform:scale(1.25);opacity:0}}
.node.boss{width:92px;height:84px;font-size:30px}
.nstars{position:absolute;bottom:-17px;left:50%;transform:translateX(-50%);font-size:14px;letter-spacing:-1px;white-space:nowrap;color:#d0d8e0}
.nstars .on{color:var(--gold);text-shadow:0 1px 0 #b77d00}
.here{position:absolute;width:58px;height:72px;top:-30px;pointer-events:none}
.here svg{width:58px;height:72px}
.start-tag{position:absolute;top:-34px;left:50%;transform:translateX(-50%);background:#fff;color:var(--wc,#2f7fd1);border:3px solid var(--line);font-family:var(--display);font-size:11px;padding:4px 10px;border-radius:12px;white-space:nowrap;animation:float 1.6s ease-in-out infinite}
@keyframes float{0%,100%{transform:translate(-50%,0)}50%{transform:translate(-50%,-5px)}}

/* --- общие панели --- */
.panel{background:#fff;border:3px solid var(--line);border-radius:20px;padding:16px;display:flex;flex-direction:column;gap:10px}
.panel p{margin:0}
.small{font-size:14px;color:var(--muted)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}

/* --- оверлеи, шторки --- */
.overlay{position:fixed;inset:0;z-index:50;background:rgba(15,30,50,.55);display:flex;align-items:flex-end;justify-content:center;animation:fade .2s}
.overlay.center{align-items:center;padding:16px}
@keyframes fade{from{opacity:0}to{opacity:1}}
.sheet{width:100%;max-width:520px;max-height:92vh;overflow:auto;background:#fff;border-radius:26px 26px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:12px;animation:up .3s ease-out}
.overlay.center .sheet{border-radius:26px;max-width:440px}
@keyframes up{from{transform:translateY(60px);opacity:0}to{transform:none;opacity:1}}
.sheet .x{position:absolute;right:14px;top:12px;width:40px;height:40px;border-radius:50%;background:var(--sky2);font-size:20px}

/* --- уроки --- */
.lesson{border:3px solid var(--line);border-left:8px solid var(--gold);border-radius:16px}
.lesson summary{list-style:none;cursor:pointer;padding:12px 14px;display:flex;justify-content:space-between;gap:10px;align-items:center;font-weight:900}
.lesson summary::-webkit-details-marker{display:none}
.lesson .k{font-family:var(--display);font-size:11px;color:var(--gold-d);display:block}
.lesson .in{padding:0 14px 14px;display:flex;flex-direction:column;gap:10px}
.when{background:#eaf4ff;border-radius:10px;padding:8px 12px}
.steps{margin:0;padding:0;list-style:none;counter-reset:s;display:flex;flex-direction:column;gap:8px}
.steps li{counter-increment:s;display:grid;grid-template-columns:28px 1fr;gap:8px}
.steps li::before{content:counter(s);font-family:var(--display);font-size:12px;background:var(--gold);color:#4a2c00;border-radius:50%;width:26px;height:26px;display:flex;align-items:center;justify-content:center}
.example{border:2px dashed var(--line);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:4px}
.trap{background:#ffe4e7;border-radius:10px;padding:8px 12px}
.lbl{font-size:12px;font-weight:900;text-transform:uppercase;letter-spacing:.05em;color:var(--blue)}

/* --- битва --- */
.battle{position:fixed;inset:0;z-index:40;background:#f6fbff;display:flex;flex-direction:column;overflow-y:auto}
.battle .inner{max-width:520px;width:100%;margin:0 auto;display:flex;flex-direction:column;min-height:100%}
.btop{display:grid;grid-template-columns:40px 1fr auto;gap:10px;align-items:center;padding:10px 14px}
.btop .close{width:40px;height:40px;border-radius:50%;font-size:22px;color:var(--muted)}
.hp{height:18px;border-radius:12px;background:#e3e9ef;overflow:hidden;position:relative;border:2px solid #fff;box-shadow:0 0 0 2px var(--line)}
.hp i{display:block;height:100%;background:linear-gradient(90deg,#ff6b6b,#ff9248);border-radius:10px;transition:width .5s cubic-bezier(.3,1.4,.6,1)}
.hp span{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:900;color:#fff;text-shadow:0 1px 1px rgba(0,0,0,.4)}
.hearts{font-size:22px;letter-spacing:1px;white-space:nowrap}
.hearts .lost{filter:grayscale(1);opacity:.35;display:inline-block;animation:heartlost .5s}
@keyframes heartlost{0%{transform:scale(1.6)}100%{transform:scale(1)}}
.arena{position:relative;height:210px;margin:0 14px;border-radius:24px;overflow:hidden;background:linear-gradient(180deg,var(--wc2,#bfe3ff),#fff 120%);border:3px solid rgba(0,0,0,.06)}
.arena .ground{position:absolute;left:-10%;right:-10%;bottom:-40px;height:90px;border-radius:50%;background:var(--wc,#2f7fd1);opacity:.25}
.arena .hill{position:absolute;right:-20px;top:66px;width:180px;height:60px;border-radius:50%;background:var(--wc,#2f7fd1);opacity:.18}
.mon{position:absolute;right:16px;top:10px;width:132px;height:132px}
.mon .mon-svg{width:132px;height:132px}
.herob{position:absolute;left:18px;bottom:6px;width:98px;height:122px}
.herob .hero-svg{width:98px;height:122px}
.sb{position:absolute;background:#fff;border:2px solid var(--ink);border-radius:14px;padding:5px 10px;font-weight:900;font-size:13px;max-width:170px;animation:pop .3s}
.sb.m{right:150px;top:16px}
.sb.h{left:120px;bottom:90px}
.combo{position:absolute;left:50%;top:10px;transform:translateX(-50%);font-family:var(--display);font-size:14px;color:#fff;background:var(--purple);padding:4px 12px;border-radius:99px;animation:pop .3s}
.proj{position:absolute;font-size:30px;pointer-events:none;z-index:5;filter:drop-shadow(0 0 6px #ffd76a)}
.dmg{position:absolute;font-family:var(--display);font-size:22px;color:var(--red);pointer-events:none;animation:dmg 1s forwards;text-shadow:0 2px 0 #fff}
@keyframes dmg{from{transform:translateY(0);opacity:1}to{transform:translateY(-50px);opacity:0}}
.pcard{margin:12px 14px 0;background:#fff;border:3px solid var(--line);border-radius:22px;padding:14px;display:flex;flex-direction:column;gap:10px}
.ptop{display:flex;justify-content:space-between;align-items:center;gap:8px}
.ptag{font-size:13px;font-weight:800;color:var(--muted)}
.lvl{color:var(--gold);letter-spacing:1px;white-space:nowrap}
.lvl .off{color:var(--line)}
.q{margin:0;font-size:19px;font-weight:700}
.eq{font-size:22px;font-weight:900;line-height:1.8}
.fr{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;line-height:1;font-weight:900;margin:0 2px}
.fr sup,.fr sub{font-size:.8em;line-height:1.05;vertical-align:baseline;position:static}
.fr sup{border-bottom:2px solid currentColor;padding:0 2px}
.fig{display:flex;justify-content:center}
.fig svg{max-width:100%;height:auto}
.fig .s{stroke:var(--ink);stroke-width:2.5;fill:none;stroke-linecap:round;stroke-linejoin:round}
.fig .f,.fig .sh{fill:#d8ecff;stroke:var(--ink);stroke-width:2.5;stroke-linejoin:round}
.fig .g{stroke:var(--line);stroke-width:1.5;fill:none}
.fig text{fill:var(--ink);font-family:var(--display);font-size:16px}
.hintbox{background:#fff6dd;border:2px solid #ffe2a0;border-radius:14px;padding:10px 12px;font-weight:700;animation:pop .3s}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{border:3px solid var(--line);background:#fff;border-radius:16px;padding:12px 14px;font-weight:900;text-align:left;min-height:54px;box-shadow:0 4px 0 var(--line);font-size:17px}
.opt[aria-pressed="true"]{border-color:var(--blue);background:#eaf4ff;box-shadow:0 4px 0 var(--blue)}
.display{display:flex;align-items:center;justify-content:space-between;background:#fff;border:3px solid var(--blue);border-radius:16px;padding:8px 14px;min-height:58px}
.display .v{font-family:var(--display);font-size:26px;font-variant-numeric:tabular-nums}
.display .ph{color:var(--muted);font-family:var(--body);font-size:16px;font-weight:700}
.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.key{background:#fff;border:3px solid var(--line);border-radius:16px;min-height:52px;font-family:var(--display);font-size:21px;box-shadow:0 4px 0 var(--line)}
.key:active{transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
.key.fn{font-family:var(--body);font-weight:900;font-size:16px;color:var(--muted)}
.bact{position:sticky;bottom:0;margin-top:auto;padding:12px 14px calc(12px + env(safe-area-inset-bottom));background:linear-gradient(180deg,rgba(246,251,255,0),#f6fbff 30%);display:grid;grid-template-columns:auto 1fr;gap:10px}
.fbar{position:fixed;left:0;right:0;bottom:0;z-index:45;animation:up .25s ease-out}
.fbar .in{max-width:520px;margin:0 auto;padding:16px 16px calc(16px + env(safe-area-inset-bottom));border-radius:24px 24px 0 0;display:flex;flex-direction:column;gap:10px}
.fbar.ok .in{background:#d7f5e1;color:#1b6b3e}
.fbar.no .in{background:#ffe0e3;color:#a32835}
.fbar h3{font-size:18px}
.fbar .sol{background:rgba(255,255,255,.7);border-radius:12px;padding:10px 12px;color:var(--ink);font-weight:700;max-height:34vh;overflow:auto}

/* --- итоги --- */
.res{align-items:center;text-align:center}
.res .big{font-family:var(--display);font-size:28px}
.bigstars{display:flex;gap:6px;justify-content:center;font-size:48px;line-height:1}
.bigstars span{color:#dfe6ec;transform:scale(0);animation:starin .5s cubic-bezier(.3,1.6,.5,1) forwards}
.bigstars span.on{color:var(--gold);text-shadow:0 3px 0 #c98200}
@keyframes starin{to{transform:scale(1)}}
.rew{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
.rew .pill{font-size:18px;padding:6px 14px}
.chest{width:150px;height:130px;margin:0 auto;cursor:pointer;animation:chestwiggle 1.2s ease-in-out infinite}
.chest .lid{transform-box:fill-box;transform-origin:0% 100%;transition:transform .5s cubic-bezier(.3,1.6,.5,1)}
.chest.open{animation:none}
.chest.open .lid{transform:rotate(-35deg) translate(-6px,-10px)}
.chest .glow{opacity:0;transition:opacity .4s}
.chest.open .glow{opacity:1}
@keyframes chestwiggle{0%,80%,100%{transform:rotate(0)}85%{transform:rotate(-6deg)}90%{transform:rotate(6deg)}95%{transform:rotate(-3deg)}}

/* --- лавка/профиль --- */
.stage{display:flex;justify-content:center;align-items:flex-end;gap:0;background:radial-gradient(circle at 50% 80%,#fff,#d6ecff);border-radius:24px;padding:10px;border:3px solid var(--line);min-height:190px}
.stage .hero-svg{width:140px;height:175px}
.stage .petw svg{width:64px;height:64px}
.cats{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px}
.cat{flex:none;border:3px solid var(--line);background:#fff;border-radius:99px;padding:6px 14px;font-weight:900}
.cat[aria-pressed="true"]{background:var(--blue);color:#fff;border-color:var(--blue)}
.items{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.item{background:#fff;border:3px solid var(--line);border-radius:18px;padding:10px;display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center}
.item.eq{border-color:var(--green);background:#effbf3}
.item .pv{height:96px;display:flex;align-items:flex-end;justify-content:center}
.item .pv .hero-svg{width:76px;height:96px}
.item .pv svg.petsvg{width:72px;height:72px}
.item b{font-size:15px}
.item .gbtn{min-height:40px;font-size:13px;padding:0 12px;width:100%}
.heroes{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.hcard{background:#fff;border:3px solid var(--line);border-radius:16px;padding:6px;display:flex;flex-direction:column;align-items:center;font-weight:900;font-size:14px}
.hcard[aria-pressed="true"]{border-color:var(--blue);background:#eaf4ff}
.hcard svg{width:64px;height:80px}
.stat{background:#fff;border:3px solid var(--line);border-radius:16px;padding:10px;text-align:center}
.stat b{display:block;font-family:var(--display);font-size:20px;color:var(--blue);font-variant-numeric:tabular-nums}
.stat span{font-size:12px;font-weight:800;color:var(--muted)}
.badges{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.badge{display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center;font-size:11px;font-weight:800;color:var(--muted)}
.badge .md{width:58px;height:58px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:28px;background:radial-gradient(circle at 35% 30%,#fff7d6,var(--gold) 60%,var(--gold-d));border:3px solid #c98200;box-shadow:0 4px 0 #c98200}
.badge.off .md{background:#e6ecf1;border-color:#cdd6df;box-shadow:0 4px 0 #cdd6df;filter:grayscale(1);opacity:.55}
.badge.off{opacity:.8}
.toggle{display:flex;justify-content:space-between;align-items:center;font-weight:800}
.sw{width:56px;height:32px;border-radius:99px;background:var(--line);position:relative;transition:background .2s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:26px;height:26px;border-radius:50%;background:#fff;transition:transform .2s;box-shadow:0 2px 3px rgba(0,0,0,.2)}
.sw[aria-checked="true"]{background:var(--green)}
.sw[aria-checked="true"]::after{transform:translateX(24px)}
.namein{font:inherit;font-weight:900;font-size:20px;border:3px solid var(--line);border-radius:14px;padding:8px 12px;width:100%;color:var(--ink)}

/* --- блиц --- */
.blitz-top{display:flex;justify-content:space-between;align-items:center}
.timer-ring{font-family:var(--display);font-size:28px;color:var(--blue);font-variant-numeric:tabular-nums}
.timer-ring.warn{color:var(--red);animation:pulse .5s infinite alternate}
@keyframes pulse{to{transform:scale(1.1)}}
.blitz-q{font-size:24px;font-weight:900;text-align:center;min-height:90px;display:flex;align-items:center;justify-content:center;padding:10px;border-radius:20px;background:#fff;border:3px solid var(--line);transition:background .2s}
.blitz-q.good{background:#d7f5e1;border-color:var(--green)}
.blitz-q.bad{background:#ffe0e3;border-color:var(--red)}

/* --- тосты и эффекты --- */
.toasts{position:fixed;top:10px;left:0;right:0;z-index:70;display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none}
.toast{background:#fff;border:3px solid var(--gold);border-radius:18px;padding:10px 16px;display:flex;align-items:center;gap:10px;font-weight:900;box-shadow:0 8px 20px rgba(0,0,0,.15);animation:toast 3.2s forwards;max-width:92vw}
.toast .md{font-size:28px}
@keyframes toast{0%{transform:translateY(-80px);opacity:0}10%,85%{transform:none;opacity:1}100%{transform:translateY(-80px);opacity:0}}
#fx{position:fixed;inset:0;pointer-events:none;z-index:80;width:100%;height:100%}
</style>
</head>

<div class="app" id="app">
  <header class="hud" id="hud"></header>
  <main id="main"></main>

</div>
<div class="battle" id="battle" hidden></div>

<canvas id="fx"></canvas>

<script>
const DATA = {"W":{"w1":[{"q":"Продолжи ряд: <b>3, 4, 6, 9, 13, 18, …</b>","type":"num","ans":24,"hint":"Найди разности соседних чисел.","sol":"Разности 1, 2, 3, 4, 5 — следующая 6. 18 + 6 = <b>24</b>.","lvl":1,"tag":0},{"q":"Продолжи ряд: <b>2, 6, 18, 54, …</b>","type":"num","ans":162,"hint":"Разности растут слишком быстро. Попробуй деление: 6 : 2, 18 : 6.","sol":"Каждое число в 3 раза больше предыдущего: 54 × 3 = <b>162</b>.","lvl":1,"tag":0},{"q":"Продолжи ряд: <b>2, 3, 5, 9, 17, …</b>","type":"num","ans":33,"hint":"Выпиши разности — что с ними происходит?","sol":"Разности 1, 2, 4, 8 удваиваются, следующая 16. 17 + 16 = <b>33</b>.","lvl":2,"tag":0},{"q":"Продолжи ряд: <b>1, 1, 2, 3, 5, 8, 13, …</b>","type":"num","ans":21,"hint":"Сложи два соседних числа.","sol":"Каждое число — сумма двух предыдущих: 8 + 13 = <b>21</b>.","lvl":2,"tag":0},{"q":"Какое число стоит на девятом месте? <b>1, 10, 3, 9, 5, 8, 7, 7, …</b>","type":"num","ans":9,"hint":"Числа то растут, то падают. Выпиши отдельно числа на нечётных местах.","sol":"Это два ряда через одно: 1, 3, 5, 7, … и 10, 9, 8, 7, … На 9-м месте — следующее число первого ряда: <b>9</b>.","lvl":2,"tag":0},{"q":"<div class='eq'>🍎 + 🍎 + 🍌 = 20<br>🍎 + 🍌 + 🍌 = 16</div>Сколько стоит 🍎?","type":"num","ans":8,"hint":"Сложи обе строчки целиком. Сколько получилось яблок и бананов?","sol":"Вместе: 3 яблока + 3 банана = 36, значит 🍎 + 🍌 = 12. В первой строчке 🍎 + (🍎 + 🍌) = 20, значит 🍎 = 20 − 12 = <b>8</b>.","lvl":2,"tag":1},{"q":"<div class='eq'>◆ × ◆ = 49<br>◆ + ★ = 15<br>★ − ● = ◆</div>Чему равен ●?","type":"num","ans":1,"hint":"Какое число, умноженное само на себя, даёт 49?","sol":"◆ = 7, ★ = 15 − 7 = 8, ● = 8 − 7 = <b>1</b>.","lvl":2,"tag":1},{"q":"Значок ✿ работает так:<div class='eq'>3 ✿ 4 = 19<br>5 ✿ 2 = 17<br>6 ✿ 1 = 13</div>Чему равно <b>4 ✿ 5</b>?","type":"num","ans":29,"hint":"Перемножь числа и посмотри, сколько не хватает до ответа.","sol":"a ✿ b = a×b + a + b. Проверка: 12+3+4 = 19, 10+5+2 = 17, 6+6+1 = 13. 4 ✿ 5 = 20 + 4 + 5 = <b>29</b>.","lvl":2,"tag":0},{"q":"Фигуры идут по кругу: ○ △ □ ○ △ □ ○ … Какая фигура стоит на 50-м месте?","type":"mc","ans":"△","opts":["○","△","□"],"hint":"Группа из трёх фигур повторяется. Сколько полных групп в 50?","sol":"50 = 16 групп по 3 (48 мест) + ещё 2. Второе место в группе — <b>△</b>.","lvl":2,"tag":0},{"q":"В пирамиде каждое число равно сумме двух чисел под ним. Нижний ряд: <b>2, 5, 3, 4</b>. Какое число на вершине?","type":"num","ans":30,"hint":"Строй по рядам снизу вверх.","sol":"Второй ряд: 7, 8, 7. Третий: 15, 15. Вершина: <b>30</b>.","lvl":2,"tag":0},{"q":"В такой же пирамиде нижний ряд: <b>3, ?, 4</b>, а на вершине 21. Какое число пропущено?","type":"num","ans":7,"hint":"Обозначь пропуск окошком. Средний ряд: 3 + □ и □ + 4. Сколько раз □ попадёт в вершину?","sol":"Вершина = (3 + □) + (□ + 4) = 7 + 2 окошка = 21. Два окошка = 14, окошко = <b>7</b>.","lvl":3,"tag":0},{"q":"Двузначное число АБ и число БА, записанное теми же цифрами наоборот, в сумме дают 121. Цифра А больше Б на 5. Найди число АБ.","type":"num","ans":83,"hint":"АБ + БА = А×11 + Б×11. Чему равна А + Б?","sol":"АБ + БА = 11×(А + Б) = 121, значит А + Б = 11. А − Б = 5. Тогда А = 8, Б = 3, число <b>83</b>. Проверка: 83 + 38 = 121.","lvl":3,"tag":2},{"q":"Ребус: <b>АБ + АБ + АБ = ВАБ</b>. Найди число АБ.","type":"num","ans":50,"hint":"Утроенное число оканчивается на те же две цифры, что и само число. Значит, удвоенное число оканчивается на 00.","sol":"ВАБ − АБ = ВОО (сотни), то есть 2 × АБ = 100 × В. Двузначное АБ возможно только при В = 1: АБ = <b>50</b>. Проверка: 50 + 50 + 50 = 150.","lvl":3,"tag":2},{"q":"Найди сумму всех цифр всех чисел от 1 до 20.","type":"num","ans":102,"hint":"Посчитай отдельно: числа 1–9, затем десятки 10–19 (цифры единиц и цифры десятков), и 20.","sol":"1–9: 45. В 10–19 десять единиц в разряде десятков (10) и единицы 0–9 (45). Число 20 даёт 2. Итого 45 + 55 + 2 = <b>102</b>.","lvl":3,"tag":0},{"q":"Перемножили двадцать троек: 3 × 3 × … × 3. На какую цифру оканчивается результат?","type":"num","ans":1,"hint":"Выпиши последние цифры: 3, 9, 27, 81, 243… Через сколько шагов они повторяются?","sol":"Последние цифры повторяются по четыре: 3, 9, 7, 1. 20 делится на 4, значит двадцатая цифра такая же, как четвёртая: <b>1</b>.","lvl":3,"tag":0},{"q":"В квадрате 3 × 3 расставлены числа от 1 до 9 так, что суммы в каждой строке, каждом столбце и на обеих диагоналях одинаковые. Какое число стоит в центре?","type":"num","ans":5,"hint":"Сначала найди сумму одной строки: 1 + 2 + … + 9 = 45, а строк три.","sol":"Сумма строки 45 : 3 = 15. Через центр проходят 4 линии (строка, столбец, 2 диагонали): их общая сумма 60, это все числа (45) плюс центр, посчитанный ещё 3 раза. 3 × центр = 15, центр = <b>5</b>.","lvl":3,"tag":1},{"q":"Вычисли удобно: 25 × 13 × 4","type":"num","ans":1300,"hint":"Найди пару, дающую 100.","sol":"25 × 4 = 100, 100 × 13 = <b>1300</b>.","lvl":1,"tag":3},{"q":"Вычисли удобно: 99 × 8","type":"num","ans":792,"hint":"99 = 100 − 1.","sol":"800 − 8 = <b>792</b>.","lvl":2,"tag":4},{"q":"Вычисли: 37 × 6 + 37 × 4","type":"num","ans":370,"hint":"Какой множитель повторяется?","sol":"37 × (6 + 4) = 37 × 10 = <b>370</b>.","lvl":2,"tag":4},{"q":"Вычисли: 101 × 23","type":"num","ans":2323,"hint":"101 = 100 + 1.","sol":"2300 + 23 = <b>2323</b>.","lvl":2,"tag":4},{"q":"Вычисли: 1 + 2 + 3 + … + 50","type":"num","ans":1275,"hint":"Пары: 1 + 50, 2 + 49…","sol":"25 пар по 51: 25 × 51 = <b>1275</b>.","lvl":2,"tag":5},{"q":"Вычисли: 4 + 8 + 12 + … + 40","type":"num","ans":220,"hint":"Сколько здесь чисел?","sol":"Чисел 10. (4 + 40) × 10 : 2 = <b>220</b>.","lvl":2,"tag":5},{"q":"Сколько чисел в ряду 7, 11, 15, …, 99?","type":"num","ans":24,"hint":"Шаг 4. Используй формулу из урока.","sol":"(99 − 7) : 4 + 1 = 23 + 1 = <b>24</b>.","lvl":2,"tag":5},{"q":"Вычисли: 100 − 99 + 98 − 97 + … + 2 − 1","type":"num","ans":50,"hint":"Сгруппируй по два: (100 − 99) + (98 − 97)…","sol":"Каждая пара даёт 1, пар 50. Ответ <b>50</b>.","lvl":3,"tag":3},{"q":"Продолжи ряд: 2, 5, 10, 17, 26, …","type":"num","ans":37,"hint":"Разности: 3, 5, 7, 9…","sol":"Следующая разность 11: 26 + 11 = <b>37</b>. (Это n × n + 1.)","lvl":2,"tag":5},{"q":"Продолжи ряд: 1, 2, 6, 24, 120, …","type":"num","ans":720,"hint":"Во сколько раз каждое число больше предыдущего?","sol":"×2, ×3, ×4, ×5, дальше ×6: 120 × 6 = <b>720</b>.","lvl":3,"tag":5},{"q":"Числа 1, 2, 3, 4, … записали подряд без пробелов: 123456789101112… Какая цифра стоит на 15-м месте?","type":"num","ans":2,"hint":"Первые 9 мест заняты однозначными числами. Дальше — по 2 цифры на число.","sol":"Места 10–11: «10», 12–13: «11», 14–15: «12». На 15-м месте — <b>2</b>.","lvl":3,"tag":5},{"q":"Вычисли: (1 + 3 + 5 + … + 19) − (2 + 4 + 6 + … + 18)","type":"num","ans":10,"hint":"Можно посчитать каждую сумму. А можно разбить на пары: 3 − 2, 5 − 4…","sol":"1 + (3 − 2) + (5 − 4) + … + (19 − 18) = 1 + 9 = <b>10</b>.","lvl":3,"tag":5}],"w2":[{"q":"Айдай ниже Бермет, но выше Венеры. Гулина выше Бермет. Кто самая высокая?","type":"mc","ans":"Гулина","opts":["Айдай","Бермет","Венера","Гулина"],"hint":"Нарисуй линию роста и ставь девочек по одной.","sol":"Сверху вниз: Гулина, Бермет, Айдай, Венера. Самая высокая — <b>Гулина</b>.","lvl":1,"tag":0},{"q":"Аян, Бек и Сыргак — врач, учитель и повар. Аян не врач и не повар. Бек не врач. Кто Сыргак?","type":"mc","ans":"врач","opts":["врач","учитель","повар"],"hint":"Начни с Аяна: у него осталась одна профессия.","sol":"Аян — учитель. Бек не врач и не учитель → повар. Сыргак — <b>врач</b>.","lvl":1,"tag":1},{"q":"В очереди за мороженым 5 детей. Эля первая. Айгуль стоит за Бекжаном. Данияр стоит перед Бекжаном, но за Сауле. Кто последний?","type":"mc","ans":"Айгуль","opts":["Эля","Сауле","Данияр","Бекжан","Айгуль"],"hint":"Выстрой цепочку: Сауле → Данияр → Бекжан → …","sol":"Очередь: Эля, Сауле, Данияр, Бекжан, Айгуль. Последняя — <b>Айгуль</b>.","lvl":1,"tag":0},{"q":"Азат старше Бектура на 2 года. Бектур младше Чынары на 3 года. Чынаре 11 лет. Сколько лет Азату?","type":"num","ans":10,"hint":"Сначала найди возраст Бектура.","sol":"Бектуру 11 − 3 = 8 лет, Азату 8 + 2 = <b>10</b>.","lvl":2,"tag":0},{"q":"В пятиэтажном доме на каждом этаже живёт один из пяти друзей. Азиз живёт на 1-м этаже, Мирлан — на 5-м. Эрмек живёт выше Нурбека, но ниже Талгата. На каком этаже живёт Эрмек?","type":"num","ans":3,"hint":"Свободны этажи 2, 3, 4. Кто из троих ниже всех?","sol":"Порядок снизу: Нурбек, Эрмек, Талгат на этажах 2, 3, 4. Эрмек — на <b>3</b>-м.","lvl":2,"tag":0},{"q":"Айжан, Бегимай и Жибек любят кошек, собак и попугаев — каждая что-то одно, и все разное. Айжан не любит кошек. Бегимай не любит ни кошек, ни собак. Кого любит Айжан?","type":"mc","ans":"собак","opts":["кошек","собак","попугаев"],"hint":"Начни с той, у кого больше всего минусов.","sol":"Бегимай — попугаи. Айжан не кошки и не попугаи → <b>собаки</b>. Жибек — кошки.","lvl":2,"tag":1},{"q":"Адилет, Бакай, Ерлан и Нурсултан живут на улицах Ленина, Токтогула, Манаса и Чуй — каждый на своей. Бакай живёт на Токтогула. Адилет не живёт ни на Чуй, ни на Манаса. Ерлан не живёт на Чуй. На какой улице живёт Нурсултан?","type":"mc","ans":"Чуй","opts":["Ленина","Токтогула","Манаса","Чуй"],"hint":"Нарисуй таблицу 4 × 4. Плюс Бакаю сразу закрывает весь столбец «Токтогула».","sol":"Бакай — Токтогула. Адилет: не Чуй, не Манаса, не Токтогула → Ленина. Ерлан: не Чуй → Манаса. Нурсултан — <b>Чуй</b>.","lvl":2,"tag":1},{"q":"Яблоко тяжелее груши, груша тяжелее сливы, а апельсин легче сливы. Какой фрукт второй по лёгкости?","type":"mc","ans":"слива","opts":["яблоко","груша","слива","апельсин"],"hint":"Выстрой фрукты от тяжёлого к лёгкому.","sol":"Порядок: яблоко, груша, слива, апельсин. Самый лёгкий — апельсин, второй по лёгкости — <b>слива</b>.","lvl":2,"tag":0},{"q":"Асан бегает быстрее Болота, но медленнее Чингиза. Данияр быстрее Чингиза. Кто из четверых прибежит третьим?","type":"mc","ans":"Асан","opts":["Асан","Болот","Чингиз","Данияр"],"hint":"Выстрой от самого быстрого.","sol":"Порядок: Данияр, Чингиз, Асан, Болот. Третий — <b>Асан</b>.","lvl":2,"tag":0},{"q":"Аскар, Бекжан и Влад съели яблоко, грушу и сливу — каждый по одному фрукту. Аскар не ел ни яблоко, ни грушу. Тот, кто съел грушу, — не Бекжан. Что съел Влад?","type":"mc","ans":"груша","opts":["яблоко","груша","слива"],"hint":"Что осталось Аскару?","sol":"Аскар — слива. Бекжан не груша → яблоко. Влад — <b>груша</b>.","lvl":2,"tag":1},{"q":"Тилек, Улан и Самат родились в январе, апреле и сентябре — каждый в своём месяце. Тилек родился не зимой. Улан родился позже Тилека. Кто родился в январе?","type":"mc","ans":"Самат","opts":["Самат","Тилек","Улан"],"hint":"Предположи, что Тилек родился в сентябре. Что тогда с Уланом?","sol":"Тилек не в январе. Если Тилек в сентябре, Улан не может родиться позже. Значит, Тилек — апрель, Улан — сентябрь, в январе — <b>Самат</b>.","lvl":2,"tag":2},{"q":"Монетка лежит в одной из трёх коробок. На 1-й: «Монетки здесь нет». На 2-й: «Монетки здесь нет». На 3-й: «Монетка во 2-й». Верна ровно одна надпись. В какой коробке монетка? (Напиши номер.)","type":"num","ans":1,"hint":"Предположи по очереди, что монетка в 1-й, во 2-й, в 3-й. Сколько надписей верно в каждом случае?","sol":"В 1-й: верна только надпись 2 — одна, подходит. Во 2-й: верны 1 и 3 — две. В 3-й: верны 1 и 2 — две. Монетка в <b>1</b>-й.","lvl":3,"tag":2},{"q":"Аида, Бибигуль, Гульнара и Динара сидят на скамейке в ряд. Аида и Гульнара сидят с краю. Бибигуль сидит рядом и с Аидой, и с Динарой. Кто сидит рядом с Гульнарой?","type":"mc","ans":"Динара","opts":["Аида","Бибигуль","Динара"],"hint":"Нарисуй 4 места. Аида с одного края, Гульнара с другого.","sol":"Аида — Бибигуль — Динара — Гульнара (или наоборот). Рядом с Гульнарой — <b>Динара</b>.","lvl":3,"tag":0},{"q":"В забеге четверо: Айбар, Бекзат, Данияр и Ислам. Айбар прибежал раньше Ислама. Бекзат не первый и не последний. Данияр прибежал сразу после Айбара. Кто прибежал третьим?","type":"mc","ans":"Бекзат","opts":["Айбар","Бекзат","Данияр","Ислам"],"hint":"Айбар и Данияр стоят вплотную. Куда можно поставить эту пару?","sol":"Пара Айбар–Данияр: если на местах 2–3 или 3–4, Бекзату остаётся 1-е или 4-е место, либо Ислам окажется раньше Айбара. Подходит только: Айбар, Данияр, <b>Бекзат</b>, Ислам.","lvl":3,"tag":2},{"q":"У Аргена, Бакыта и Влада рубашки красного, синего и белого цвета и шорты тех же трёх цветов (у всех разные). У Аргена рубашка и шорты одного цвета, а у остальных — разного. У Бакыта ни рубашка, ни шорты не красные. У Влада белые шорты. Какого цвета рубашка у Влада?","type":"mc","ans":"синяя","opts":["красная","синяя","белая"],"hint":"Сделай две таблицы: для рубашек и для шорт. Начни с шорт.","sol":"Шорты: Влад — белые, Бакыт не красные → синие, Арген — красные. Значит, рубашка Аргена тоже красная. Бакыт: рубашка не синяя (не как шорты) → белая. Влад — <b>синяя</b>.","lvl":3,"tag":1},{"q":"Дастан старше Эмиля на 3 года. Эмиль младше Фатимы на 1 год. Фатима старше Гули на 4 года. На сколько лет Дастан старше Гули?","type":"num","ans":6,"hint":"Поставь всех на линию возраста, начиная с Эмиля.","sol":"Если Эмилю x лет: Дастану x+3, Фатиме x+1, Гуле x+1−4 = x−3. Разница (x+3) − (x−3) = <b>6</b> лет.","lvl":3,"tag":0},{"q":"Айгуль старше Бекзата на 2 года. Бекзат младше Вали на 5 лет. Валя старше Гули на 1 год. Кто самый младший?","type":"mc","ans":"Бекзат","opts":["Айгуль","Бекзат","Валя","Гуля"],"hint":"Пусть Бекзату x лет. Сколько остальным?","sol":"Айгуль x+2, Валя x+5, Гуля x+4. Самый младший — <b>Бекзат</b>.","lvl":2,"tag":3},{"q":"Аман, Бекжан, Данияр и Эрлан занимаются футболом, плаванием, шахматами и борьбой (каждый своим). Аман не плавает и не играет в шахматы. Бекжан — борец. Данияр не играет в футбол. Эрлан не плавает. Кто играет в шахматы?","type":"mc","ans":"Эрлан","opts":["Аман","Бекжан","Данияр","Эрлан"],"hint":"Таблица 4 × 4. Начни с Бекжана, потом Аман.","sol":"Бекжан — борьба. Аман: не плавание, не шахматы, не борьба → футбол. Эрлан: не плавание, не футбол → <b>шахматы</b>. Данияр — плавание.","lvl":2,"tag":3},{"q":"Айым, Бактыгуль и Сезим живут в Бишкеке, Оше и Караколе и любят яблоки, абрикосы и вишню (все разное). Айым не из Оша. Та, что из Оша, любит абрикосы. Сезим не любит абрикосы и живёт не в Бишкеке. Девочка из Бишкека любит яблоки. Где живёт любительница вишни?","type":"mc","ans":"в Караколе","opts":["в Бишкеке","в Оше","в Караколе"],"hint":"Кто из Оша? Ни Айым, ни Сезим (она не любит абрикосы).","sol":"Из Оша — Бактыгуль (абрикосы). Сезим не в Бишкеке → Каракол, Айым → Бишкек → яблоки. Сезим любит вишню и живёт <b>в Караколе</b>.","lvl":3,"tag":3},{"q":"Встретились Белов, Чернов и Рыжов. Один — блондин, другой — брюнет, третий — рыжий. Брюнет сказал Белову: «Ни у кого из нас цвет волос не совпадает с фамилией». Какого цвета волосы у Чернова?","type":"mc","ans":"блондин","opts":["блондин","брюнет","рыжий"],"hint":"Белов не блондин (фамилия) и не брюнет (брюнет с ним разговаривает).","sol":"Белов — рыжий. Чернов не брюнет и не рыжий → <b>блондин</b>. Рыжов — брюнет.","lvl":3,"tag":3},{"q":"Если Тилек сделал уроки, то он идёт гулять. Сегодня Тилек гулять не пошёл. Что точно известно?","type":"mc","ans":"Тилек не сделал уроки","opts":["Тилек сделал уроки","Тилек не сделал уроки","Ничего сказать нельзя"],"hint":"Правило 2 из урока «Если — то».","sol":"Если бы уроки были сделаны, он бы пошёл гулять. Не пошёл → <b>уроки не сделаны</b>.","lvl":2,"tag":4},{"q":"Если идёт дождь, Асан берёт зонт. Сегодня Асан взял зонт. Что можно сказать о дожде?","type":"mc","ans":"Сказать точно нельзя","opts":["Шёл дождь","Дождя не было","Сказать точно нельзя"],"hint":"Мог ли Асан взять зонт по другой причине?","sol":"Из «взял зонт» дождь не следует. <b>Сказать точно нельзя</b>.","lvl":2,"tag":4},{"q":"Все мои кошки — рыжие. Мурка — рыжая кошка. Можно ли сказать, моя ли это кошка?","type":"mc","ans":"Сказать нельзя","opts":["Да, это моя кошка","Нет, это не моя кошка","Сказать нельзя"],"hint":"Бывают ли рыжие кошки, которые не мои?","sol":"Рыжими бывают и чужие кошки. <b>Сказать нельзя</b>.","lvl":3,"tag":4},{"q":"Пятеро бежали наперегонки. Азамат обогнал Болота, но проиграл Чынаре. Данияр финишировал сразу за Болотом. Эмир — последний. Кто пришёл третьим?","type":"mc","ans":"Болот","opts":["Азамат","Болот","Чынара","Данияр","Эмир"],"hint":"Цепочка: Чынара → Азамат → Болот → Данияр.","sol":"Порядок: Чынара, Азамат, <b>Болот</b>, Данияр, Эмир.","lvl":2,"tag":5},{"q":"Айжан, Бекзат, Гуля и Данияр сидят за круглым столом на четырёх стульях. Айжан сидит напротив Бекзата. Гуля сидит слева от Айжан. Кто сидит справа от Айжан?","type":"mc","ans":"Данияр","opts":["Бекзат","Гуля","Данияр"],"hint":"Нарисуй 4 стула крестом.","sol":"Соседи Айжан — двое, кроме Бекзата: Гуля слева, значит справа — <b>Данияр</b>.","lvl":2,"tag":5},{"q":"На улице 5 домов подряд, с № 1 по № 5: жёлтый, синий, красный, белый и зелёный (порядок неизвестен). Жёлтый — № 1, зелёный — № 5. Белый стоит рядом с зелёным. Синий стоит рядом с жёлтым. Какой номер у красного дома?","type":"num","ans":3,"hint":"Расставь по очереди: известные, потом соседей.","sol":"Белый — № 4, синий — № 2, красный — <b>3</b>.","lvl":2,"tag":5},{"q":"В трёх коробках лежат 2 белых шара, 2 чёрных и белый с чёрным. Надписи «ББ», «ЧЧ», «БЧ» перепутаны: ни одна не верна. Можно не глядя достать один шар из одной коробки. Из какой коробки достать, чтобы узнать, что лежит во всех?","type":"mc","ans":"Из «БЧ»","opts":["Из «ББ»","Из «ЧЧ»","Из «БЧ»"],"hint":"Что на самом деле может лежать в коробке «БЧ»?","sol":"В «БЧ» лежат одинаковые шары. Достали белый → там ББ. Тогда в «ЧЧ» не ЧЧ и не ББ → БЧ, в «ББ» — ЧЧ. Ответ: <b>из «БЧ»</b>.","lvl":3,"tag":3},{"q":"Я задумал двузначное число. Оно чётное, сумма его цифр 9, а цифра десятков больше цифры единиц на 5. Какое число?","type":"num","ans":72,"hint":"Перебери пары цифр с суммой 9 и разностью 5.","sol":"Сумма 9 и разность 5: 7 и 2. Число <b>72</b> — чётное, подходит.","lvl":2,"tag":3}],"w3":[{"q":"Житель острова сказал: «Я рыцарь». Кто он?","type":"mc","ans":"узнать нельзя","opts":["рыцарь","лжец","узнать нельзя"],"hint":"Может ли так сказать рыцарь? А лжец?","sol":"Рыцарь скажет «Я рыцарь» — это правда. Лжец тоже скажет «Я рыцарь» — это ложь. <b>Узнать нельзя</b>.","lvl":1,"tag":0},{"q":"Может ли кто-нибудь на острове рыцарей и лжецов сказать: «Я лжец»?","type":"mc","ans":"нет","opts":["да","нет"],"hint":"Проверь оба варианта.","sol":"Рыцарь сказал бы неправду, лжец — правду. Ни тот, ни другой так не может. <b>Нет</b>.","lvl":1,"tag":0},{"q":"Лжеца спросили: «Сколько будет 3 + 4?» Какой ответ он точно не мог дать?","type":"mc","ans":"7","opts":["6","7","8","100"],"hint":"Лжец всегда говорит неправду.","sol":"Правильный ответ 7 — лжец его никогда не скажет. Ответ: <b>7</b>.","lvl":1,"tag":0},{"q":"А сказал: «Хотя бы один из нас двоих лжец». Кто такой Б?","type":"mc","ans":"лжец","opts":["рыцарь","лжец"],"hint":"Может ли А быть лжецом? Что тогда было бы на самом деле?","sol":"Если А лжец, то его фраза ложна, и оба — рыцари. Но А лжец — противоречие. Значит, А рыцарь, фраза верна, и лжец — Б. Ответ: <b>лжец</b>.","lvl":2,"tag":0},{"q":"Первый сказал: «Мы оба рыцари». Второй сказал: «Первый — лжец». Кто второй?","type":"mc","ans":"рыцарь","opts":["рыцарь","лжец"],"hint":"Предположи, что первый — рыцарь.","sol":"Если первый рыцарь, то и второй рыцарь, но второй называет первого лжецом — противоречие. Первый — лжец, и второй сказал правду: он <b>рыцарь</b>.","lvl":2,"tag":0},{"q":"А сказал: «Б — рыцарь». Б сказал: «Мы с А разные: один рыцарь, другой лжец». Кто А?","type":"mc","ans":"лжец","opts":["рыцарь","лжец"],"hint":"Если А рыцарь, то кто Б? Что тогда со словами Б?","sol":"Если А рыцарь, Б тоже рыцарь, но тогда слова Б «мы разные» ложны — противоречие. Значит, А <b>лжец</b>, Б тоже лжец (они не разные — Б солгал).","lvl":2,"tag":0},{"q":"Окно разбил один из троих. Асан: «Это Бакыт». Бакыт: «Асан говорит неправду». Чоро: «Это не я». Правду сказал только один. Кто разбил окно?","type":"mc","ans":"Чоро","opts":["Асан","Бакыт","Чоро"],"hint":"Проверь три варианта: виноват Асан, Бакыт, Чоро.","sol":"Асан: правдивы Бакыт и Чоро — двое. Бакыт: правдивы Асан и Чоро — двое. Чоро: правдив только Бакыт — один. Разбил <b>Чоро</b>.","lvl":2,"tag":1},{"q":"Кольцо лежит в одной из трёх шкатулок. На золотой: «Кольцо в серебряной». На серебряной: «Кольцо не здесь». На бронзовой: «Кольцо не в золотой». Правдива ровно одна надпись. Где кольцо?","type":"mc","ans":"золотая","opts":["золотая","серебряная","бронзовая"],"hint":"Посчитай правдивые надписи для каждой шкатулки.","sol":"В золотой: правдива только серебряная — одна. В серебряной: правдивы золотая и бронзовая. В бронзовой: правдивы серебряная и бронзовая. Кольцо в <b>золотой</b>.","lvl":2,"tag":1},{"q":"Ручка лежит в одном месте. Айдар: «Она в портфеле или в сумке». Бекболот: «Её нет в столе». Нурай: «Она в шкафу». Все трое ошиблись. Где ручка?","type":"mc","ans":"в столе","opts":["в портфеле","в столе","в шкафу","в сумке"],"hint":"Если все ошиблись, переверни каждую фразу наоборот.","sol":"Бекболот ошибся → ручка <b>в столе</b>. Проверка: не в портфеле и не в сумке, не в шкафу — все ошиблись.","lvl":1,"tag":1},{"q":"Один из братьев съел варенье. Тимур: «Это Арсен». Арсен: «Тимур лжёт». Ильяс: «Это Тимур». Двое сказали правду, один солгал. Кто съел варенье?","type":"mc","ans":"Тимур","opts":["Тимур","Арсен","Ильяс"],"hint":"Нужны варианты, где правдивых ровно двое.","sol":"Тимур: правдивы Арсен и Ильяс — двое, подходит. Арсен: правдив только Тимур. Ильяс: правдив только Арсен. Съел <b>Тимур</b>.","lvl":3,"tag":1},{"q":"Трое жителей. А: «Б — лжец». Б: «В — лжец». В: «А и Б оба лжецы». Сколько среди них рыцарей?","type":"num","ans":1,"hint":"Начни с В: может ли он быть рыцарем?","sol":"Если В рыцарь, А и Б лжецы, но тогда А солгал «Б лжец» → Б рыцарь — противоречие. В лжец. Тогда Б сказал правду → Б рыцарь. А сказал «Б лжец» — ложь → А лжец. Рыцарь один: <b>1</b>.","lvl":3,"tag":0},{"q":"Трое жителей. А: «Среди нас ровно один лжец». Б: «Среди нас ровно два лжеца». В: «Мы все трое лжецы». Кто из них рыцарь?","type":"mc","ans":"Б","opts":["А","Б","В","никто"],"hint":"Может ли больше одной фразы быть правдой? Может ли быть правдой фраза В?","sol":"Фразы противоречат друг другу, правдивой может быть только одна. Фраза В правдой быть не может (тогда В был бы рыцарем). Если все лгут, все лжецы — но тогда фраза В верна. Значит, правдива ровно одна фраза, рыцарь один, лжецов двое — прав <b>Б</b>.","lvl":3,"tag":0},{"q":"За круглым столом 12 жителей. Каждый сказал: «Мой сосед справа — лжец». Сколько среди них рыцарей?","type":"num","ans":6,"hint":"Кто сидит справа от рыцаря? А справа от лжеца?","sol":"Рыцари и лжецы чередуются, поэтому рыцарей половина: <b>6</b>.","lvl":2,"tag":2},{"q":"В ряд стоят 5 жителей. Каждый сказал: «Сразу слева от меня стоит лжец». (Слева от первого никого нет.) Сколько среди них рыцарей?","type":"num","ans":2,"hint":"Начни с самого левого: правду ли он сказал?","sol":"Первый солгал (слева никого) → лжец. Второй: слева лжец — правда → рыцарь. Третий: слева рыцарь — ложь → лжец. Дальше рыцарь, лжец. Рыцарей <b>2</b>.","lvl":3,"tag":2},{"q":"За круглым столом 10 жителей. Каждый сказал: «Оба моих соседа — лжецы». Какое наибольшее число рыцарей может быть за столом?","type":"num","ans":5,"hint":"Могут ли два рыцаря сидеть рядом?","sol":"Рядом с рыцарем сидят только лжецы, поэтому рыцари не соседи — их не больше половины. Чередование Р, Л, Р, Л… подходит: каждый лжец сидит между рыцарями и лжёт. Ответ: <b>5</b>.","lvl":3,"tag":2},{"q":"В комнате 5 жителей. Каждый сказал: «Все остальные в этой комнате — лжецы». Сколько среди них рыцарей?","type":"num","ans":1,"hint":"Может ли рыцарей быть 0? А 2?","sol":"Если рыцарей 0, все сказали правду — противоречие. Если 2 и больше, рыцарь назвал другого рыцаря лжецом — противоречие. Один рыцарь подходит: он прав, а остальные лгут, потому что среди «остальных» есть рыцарь. Ответ: <b>1</b>.","lvl":3,"tag":2},{"q":"Что ответит лжец на вопрос «Ты рыцарь?»","type":"mc","ans":"да","opts":["да","нет"],"hint":"Правдивый ответ лжеца — «нет». Но он лжёт.","sol":"Лжец солжёт: <b>да</b>.","lvl":1,"tag":3},{"q":"Что ответит любой житель острова рыцарей и лжецов на вопрос «Ты лжец?»","type":"mc","ans":"нет","opts":["да","нет","зависит от того, кто он"],"hint":"Проверь рыцаря и лжеца отдельно.","sol":"Рыцарь честно скажет «нет», лжец солжёт «нет». Ответ: <b>нет</b>.","lvl":2,"tag":3},{"q":"Жителя острова рыцарей и лжецов спросили: «Ты рыцарь?» Он ответил: «Нет». Кто он?","type":"mc","ans":"такого быть не может","opts":["рыцарь","лжец","такого быть не может"],"hint":"Вспомни первый пункт урока.","sol":"И рыцарь, и лжец отвечают «да». <b>Такого быть не может</b>.","lvl":2,"tag":3},{"q":"Перед тобой рыцарь и лжец, но ты не знаешь, кто есть кто. Какое наименьшее число вопросов «да/нет» нужно задать одному из них, чтобы узнать, кто рыцарь?","type":"num","ans":1,"hint":"Спроси то, что ты сам знаешь.","sol":"Один вопрос «2 + 2 = 4?»: «да» — рыцарь, «нет» — лжец. Ответ: <b>1</b>.","lvl":2,"tag":3},{"q":"Среди А, Б и В один рыцарь, один лжец и один хитрец. А: «Я лжец». Б: «А — рыцарь». Кто рыцарь?","type":"mc","ans":"В","opts":["А","Б","В"],"hint":"Кто мог сказать «Я лжец»?","sol":"А — хитрец. Б сказал «А — рыцарь» — это ложь, значит Б лжец. Рыцарь — <b>В</b>.","lvl":3,"tag":4},{"q":"Среди А, Б и В один рыцарь, один лжец и один хитрец. А: «Я рыцарь». Б: «А — рыцарь». В: «Я хитрец». Кто хитрец?","type":"mc","ans":"Б","opts":["А","Б","В"],"hint":"Может ли рыцарь сказать «Я хитрец»? Значит, кто такой В?","sol":"В — не рыцарь. Если В хитрец, то рыцарь и лжец — А и Б, но они говорят одно и то же — противоречие. Значит, В лжец. Если А хитрец, Б рыцарь — но Б сказал «А рыцарь», ложь. Значит, А рыцарь, <b>Б</b> — хитрец.","lvl":3,"tag":4},{"q":"Двое. А: «Я рыцарь, а Б — лжец». Б: «А — рыцарь». Сколько среди них рыцарей?","type":"num","ans":0,"hint":"Если А рыцарь — что со словами Б?","sol":"Если А рыцарь, Б лжец, но Б сказал правду «А рыцарь» — нельзя. А — лжец. Тогда Б солгал «А — рыцарь» → Б лжец. Рыцарей <b>0</b>.","lvl":2,"tag":5},{"q":"За круглым столом 9 жителей. Каждый сказал: «Мой сосед справа — рыцарь». Сколько среди них может быть лжецов?","type":"mc","ans":"0 или 9","opts":["только 0","только 9","0 или 9","любое число"],"hint":"Кто сидит справа от рыцаря? А справа от лжеца?","sol":"Справа от рыцаря — рыцарь, и так по кругу все рыцари. Справа от лжеца — лжец, и все лжецы. Ответ: <b>0 или 9</b>.","lvl":3,"tag":5},{"q":"В ряд стоят 6 жителей. Каждый сказал: «Рядом со мной стоит хотя бы один лжец». Какое наибольшее число рыцарей может быть в ряду?","type":"num","ans":4,"hint":"Рядом с лжецом — только рыцари (он солгал). У каждого рыцаря рядом есть лжец.","sol":"Пример: Р Л Р Р Л Р — 4 рыцаря, всё сходится. 5 рыцарей не выйдет: единственному лжецу не хватит, чтобы стоять рядом с каждым рыцарем. Ответ: <b>4</b>.","lvl":3,"tag":5},{"q":"Пятерых жителей спросили: «Сколько среди вас рыцарей?» Они ответили: 1, 2, 3, 4 и 5. Известно, что рыцари среди них есть. Сколько рыцарей?","type":"num","ans":1,"hint":"Все ответы разные. Сколько из них могут быть правдой?","sol":"Правдой может быть не больше одного ответа, значит рыцарь не больше одного. Рыцари есть → он один и ответил «1». Ответ: <b>1</b>.","lvl":3,"tag":5},{"q":"Мяч взял один из троих. Айбек: «Не я». Бакыт: «Это Айбек». Влад: «Это не Бакыт». Правду сказал ровно один. Кто взял мяч?","type":"mc","ans":"Бакыт","opts":["Айбек","Бакыт","Влад"],"hint":"Проверь три варианта.","sol":"Айбек: правдивы Бакыт и Влад. Бакыт: правдив только Айбек — подходит. Влад: правдивы Айбек и Влад. Взял <b>Бакыт</b>.","lvl":2,"tag":5},{"q":"Вазу разбил один из четверых. А: «Это Б». Б: «Это Г». В: «Это не я». Г: «Б лжёт». Правду сказал только один. Кто разбил вазу?","type":"mc","ans":"В","opts":["А","Б","В","Г"],"hint":"Проверь каждого: сколько фраз станут правдой?","sol":"А: правдивы В и Г (2). Б: правдивы А, В, Г (3). В: правдив только Г (1). Г: правдивы Б и В (2). Разбил <b>В</b>.","lvl":3,"tag":5}],"w4":[{"q":"Из 3 монет одна фальшивая (легче). Сколько взвешиваний нужно, чтобы точно её найти?","type":"num","ans":1,"hint":"Положи по одной монете на чаши.","sol":"Если перевесила одна чаша, фальшивая на лёгкой. Если равновесие — фальшивая третья. <b>1</b> взвешивание.","lvl":1,"tag":0},{"q":"Из 27 монет одна фальшивая (легче). Наименьшее число взвешиваний?","type":"num","ans":3,"hint":"3 → 1 взвешивание, 9 → 2. А 27?","sol":"Делим на 3 кучки по 9 — узнаём девятку. Дальше как в уроке: ещё 2. Всего <b>3</b>.","lvl":1,"tag":0},{"q":"Из 10 монет одна фальшивая (легче). Наименьшее число взвешиваний, чтобы точно её найти?","type":"num","ans":3,"hint":"За 2 взвешивания можно проверить только 9 монет. 10 больше 9.","sol":"За 2 взвешивания — максимум 9 монет, а 10 больше. За 3 — до 27, так что нужно <b>3</b> (например, 3 + 3, а в стороне 4).","lvl":2,"tag":0},{"q":"Из 8 конфет одна тяжелее остальных. Можно ли найти её за 2 взвешивания?","type":"mc","ans":"да","opts":["да","нет"],"hint":"Сколько предметов можно проверить за 2 взвешивания?","sol":"За 2 взвешивания можно проверить до 9 предметов: 3 + 3 на весы, 2 в стороне. <b>Да</b>.","lvl":2,"tag":0},{"q":"Есть чашечные весы и две гири: 1 кг и 3 кг. Гири можно класть на обе чаши. Сколько разных масс (целое число кг) можно отвесить?","type":"num","ans":4,"hint":"Гиря на чаше с товаром «вычитается».","sol":"1 кг, 3 кг, 1 + 3 = 4 кг, а 3 − 1 = 2 кг (гиря 1 кг на чаше с товаром). Всего <b>4</b>.","lvl":3,"tag":0},{"q":"Есть банки 3 л и 5 л и кран. Наполнили 3-литровую и перелили в 5-литровую. Снова наполнили 3-литровую и доливаем 5-литровую доверху. Где получится ровно 1 л?","type":"mc","ans":"в 3-литровой","opts":["в 3-литровой","в 5-литровой"],"hint":"Сколько места осталось в 5-литровой после первого переливания?","sol":"В 5-литровой 3 л, места осталось 2 л. Из 3-литровой уйдёт 2 л, и в ней останется 1 л — <b>в 3-литровой</b>.","lvl":2,"tag":1},{"q":"Банки 4 л и 9 л. Наполнили 9-литровую, потом дважды отлили из неё в пустую 4-литровую (каждый раз выливая 4-литровую). Сколько литров осталось в 9-литровой?","type":"num","ans":1,"hint":"Сколько ушло за два раза?","sol":"9 − 4 − 4 = <b>1</b> л.","lvl":2,"tag":1},{"q":"В бидоне 8 л молока, есть пустые банки 5 л и 3 л. Нужно разделить молоко пополам: по 4 л. Какое наименьшее число переливаний понадобится?","type":"num","ans":7,"hint":"Записывай таблицу (бидон, 5 л, 3 л). Начни с (3, 5, 0).","sol":"(8,0,0) → (3,5,0) → (3,2,3) → (6,2,0) → (6,0,2) → (1,5,2) → (1,4,3) → (4,4,0). Всего <b>7</b> переливаний.","lvl":3,"tag":1},{"q":"В ящике 4 чёрных и 4 белых носка. Сколько носков нужно взять в темноте, чтобы точно была пара одного цвета?","type":"num","ans":3,"hint":"Худший случай: первые два — разного цвета.","sol":"Два могут быть разными, третий совпадёт с одним из них: <b>3</b>.","lvl":1,"tag":2},{"q":"В коробке 3 красных и 5 синих карандашей. Сколько нужно взять не глядя, чтобы точно был синий?","type":"num","ans":4,"hint":"Сначала могут попасться все красные.","sol":"Худший случай: 3 красных. Четвёртый точно синий: <b>4</b>.","lvl":2,"tag":2},{"q":"В той же коробке (3 красных, 5 синих). Сколько нужно взять, чтобы точно были карандаши обоих цветов?","type":"num","ans":6,"hint":"Какого цвета больше? Их все могут вынуть первыми.","sol":"Худший случай: все 5 синих. Шестой — красный: <b>6</b>.","lvl":2,"tag":2},{"q":"В мешке 5 красных, 7 синих и 10 зелёных шаров. Сколько нужно вынуть, чтобы точно был хотя бы один красный?","type":"num","ans":18,"hint":"Не везёт: сначала все не-красные.","sol":"7 синих + 10 зелёных = 17. Восемнадцатый — красный: <b>18</b>.","lvl":2,"tag":2},{"q":"В том же мешке (5 красных, 7 синих, 10 зелёных). Сколько нужно вынуть, чтобы точно были 2 шара разного цвета?","type":"num","ans":11,"hint":"Самый неудачный случай — долго тянуть один цвет. Какой цвет можно тянуть дольше всех?","sol":"Можно вытянуть все 10 зелёных. Одиннадцатый — другого цвета: <b>11</b>.","lvl":3,"tag":2},{"q":"В том же мешке. Сколько нужно вынуть, чтобы точно нашлись шары всех трёх цветов?","type":"num","ans":18,"hint":"Худший случай: вынуть все шары двух самых многочисленных цветов.","sol":"10 зелёных + 7 синих = 17 — и ни одного красного. Восемнадцатый — красный: <b>18</b>.","lvl":3,"tag":2},{"q":"В тёмной кладовке 5 пар чёрных и 5 пар коричневых ботинок. Сколько ботинок нужно взять, чтобы точно получилась пара (левый и правый одного цвета)?","type":"num","ans":11,"hint":"Обрати внимание: ботинки бывают левые и правые. Сколько можно взять одних левых?","sol":"Худший случай: все 10 левых (5 чёрных + 5 коричневых). Одиннадцатый — правый и подойдёт к левому того же цвета: <b>11</b>.","lvl":3,"tag":2},{"q":"Есть 3 замка и 3 ключа, каждый ключ подходит к одному замку. Какое наименьшее число проб нужно в худшем случае, чтобы точно узнать, какой ключ к какому замку?","type":"num","ans":3,"hint":"Первый ключ пробуй к замкам по очереди. Нужна ли третья проба для него?","sol":"Первый ключ: 2 пробы (если не подошёл к двум, то он от третьего). Второй ключ: 1 проба. Третий ключ — без проб. Всего <b>3</b>.","lvl":3,"tag":2}],"w5":[{"q":"У Айбека 3 футболки и 4 пары шорт. Сколько разных комплектов он может надеть?","type":"num","ans":12,"hint":"Правило умножения.","sol":"3 × 4 = <b>12</b>.","lvl":1,"tag":1},{"q":"Сколько всего квадратов на рисунке (сетка 4 × 4)?","type":"num","ans":30,"hint":"Посчитай квадраты 1×1, 2×2, 3×3 и 4×4 отдельно.","sol":"16 + 9 + 4 + 1 = <b>30</b>.","lvl":2,"fig":"a_grid4","tag":2},{"q":"Сколько трёхзначных чисел можно составить из цифр 1, 2, 3, 4, если цифры не повторяются?","type":"num","ans":24,"hint":"Сколько вариантов для первой цифры? Для второй? Для третьей?","sol":"4 × 3 × 2 = <b>24</b>.","lvl":2,"tag":1},{"q":"Сколько трёхзначных чисел можно составить из цифр 0, 1, 2, 3, если цифры не повторяются?","type":"num","ans":18,"hint":"Осторожно: на первом месте не может стоять 0.","sol":"Первая цифра: 3 варианта (не 0). Вторая: 3 (оставшиеся, включая 0). Третья: 2. 3 × 3 × 2 = <b>18</b>.","lvl":2,"tag":1},{"q":"Восемь друзей при встрече пожали руки каждый каждому. Сколько было рукопожатий?","type":"num","ans":28,"hint":"7 + 6 + … + 1.","sol":"7 + 6 + 5 + 4 + 3 + 2 + 1 = <b>28</b>.","lvl":2,"tag":3},{"q":"В шахматном турнире каждый сыграл с каждым по одной партии. Всего сыграли 15 партий. Сколько было участников?","type":"num","ans":6,"hint":"Складывай 1 + 2 + 3 + … пока не получится 15.","sol":"1 + 2 + 3 + 4 + 5 = 15 — это 6 участников (первый сыграл 5 партий). Ответ: <b>6</b>.","lvl":3,"tag":3},{"q":"На прямой отметили 6 точек. Сколько отрезков с концами в этих точках?","type":"num","ans":15,"hint":"Как рукопожатия у 6 человек.","sol":"5 + 4 + 3 + 2 + 1 = <b>15</b>.","lvl":2,"tag":3},{"q":"Сколько всего треугольников на рисунке?","type":"num","ans":10,"hint":"Треугольник задаётся двумя точками на нижней линии.","sol":"На нижней линии 5 точек, пар точек 4 + 3 + 2 + 1 = <b>10</b>.","lvl":2,"fig":"a_fan","tag":2},{"q":"Муравей ползёт по линиям из A в B только вправо или вверх. Сколько у него путей?","type":"num","ans":10,"hint":"Пиши в каждом узле число путей: сумма числа слева и числа снизу.","sol":"Нижний ряд и левый столбец — по 1. Средний ряд: 1, 2, 3, 4. Верхний: 1, 3, 6, <b>10</b>.","lvl":2,"fig":"a_routes32","tag":0},{"q":"Теперь сетка 3 × 3. Сколько путей из A в B, если двигаться только вправо или вверх?","type":"num","ans":20,"hint":"Тот же приём: числа в узлах.","sol":"Ряды снизу: 1,1,1,1 → 1,2,3,4 → 1,3,6,10 → 1,4,10,<b>20</b>.","lvl":3,"fig":"a_routes33","tag":0},{"q":"Сколько всего прямоугольников на полоске из 5 клеток? (Квадрат — тоже прямоугольник.)","type":"num","ans":15,"hint":"Длины 1, 2, 3, 4, 5 — посчитай каждую.","sol":"5 + 4 + 3 + 2 + 1 = <b>15</b>.","lvl":2,"fig":"a_strip5","tag":2},{"q":"Сколько всего прямоугольников на рисунке (сетка 2 ряда × 3 столбца)?","type":"num","ans":18,"hint":"Прямоугольник задают 2 вертикальные и 2 горизонтальные линии. Посчитай пары тех и других.","sol":"Вертикальных линий 4 — пар 3 + 2 + 1 = 6. Горизонтальных 3 — пар 2 + 1 = 3. 6 × 3 = <b>18</b>.","lvl":3,"fig":"a_grid23","tag":2},{"q":"Сколько двузначных чисел, у которых цифра десятков больше цифры единиц?","type":"num","ans":45,"hint":"Перебери по цифре десятков: если десятков 1, единиц может быть только 0…","sol":"Десятки 1 → 1 число, 2 → 2, …, 9 → 9. 1 + 2 + … + 9 = <b>45</b>.","lvl":3,"tag":0},{"q":"Сколько чисел от 1 до 100 содержат хотя бы одну цифру 7?","type":"num","ans":19,"hint":"Посчитай числа с 7 в единицах и с 7 в десятках. Какое число посчитано дважды?","sol":"7 в единицах: 7, 17, …, 97 — 10. 7 в десятках: 70–79 — 10. Число 77 посчитано дважды: 10 + 10 − 1 = <b>19</b>.","lvl":2,"tag":0},{"q":"Для нумерации страниц книги понадобилась 141 цифра. Сколько страниц в книге?","type":"num","ans":75,"hint":"Страницы 1–9 съели 9 цифр. Остальные — по 2 цифры.","sol":"141 − 9 = 132 цифры на двузначные номера, это 66 страниц (с 10-й по 75-ю). Всего <b>75</b>.","lvl":3,"tag":0},{"q":"Флаг из трёх горизонтальных полос красят в красный, жёлтый, зелёный и синий. Соседние полосы должны быть разного цвета (верхняя и нижняя могут совпадать). Сколько разных флагов?","type":"num","ans":36,"hint":"Верхняя полоса — 4 варианта. Средняя — сколько? Нижняя — отличается только от средней.","sol":"4 × 3 × 3 = <b>36</b>.","lvl":3,"tag":1},{"q":"Сколько трёхзначных чисел с разными цифрами можно составить из цифр 1, 2, 3, 4, 5, 6?","type":"num","ans":120,"hint":"6 × 5 × …","sol":"6 × 5 × 4 = <b>120</b>.","lvl":2,"tag":4},{"q":"Сколько трёхзначных чётных чисел можно составить из цифр 1, 2, 3, 4, 5 (цифры могут повторяться)?","type":"num","ans":50,"hint":"Начни с последней цифры.","sol":"Последняя: 2 или 4 (2 варианта). Первые две: по 5. 5 × 5 × 2 = <b>50</b>.","lvl":2,"tag":4},{"q":"Сколько трёхзначных чисел, у которых все цифры нечётные и разные?","type":"num","ans":60,"hint":"Нечётных цифр пять.","sol":"5 × 4 × 3 = <b>60</b>.","lvl":2,"tag":4},{"q":"Сколькими способами 4 друга могут встать в очередь?","type":"num","ans":24,"hint":"На первое место — 4 варианта…","sol":"4 × 3 × 2 × 1 = <b>24</b>.","lvl":1,"tag":4},{"q":"Четверо встают в очередь, но Айбек обязательно первый. Сколько способов?","type":"num","ans":6,"hint":"Остальные трое — в любом порядке.","sol":"3 × 2 × 1 = <b>6</b>.","lvl":2,"tag":4},{"q":"Пятеро садятся на скамейку в ряд. Двое друзей хотят сидеть рядом. Сколько способов?","type":"num","ans":48,"hint":"Склей друзей в один блок. Сколько «мест» теперь?","sol":"Блок + 3 человека = 4 элемента: 24 способа. Внутри блока 2 порядка: 24 × 2 = <b>48</b>.","lvl":3,"tag":6},{"q":"Сколько двузначных чисел, у которых обе цифры чётные?","type":"num","ans":20,"hint":"Первая цифра не может быть 0.","sol":"Десятки: 2, 4, 6, 8 (4). Единицы: 0, 2, 4, 6, 8 (5). 4 × 5 = <b>20</b>.","lvl":2,"tag":4},{"q":"Сколько трёхзначных чисел содержат хотя бы одну цифру 5?","type":"num","ans":252,"hint":"Всего трёхзначных 900. Сколько без пятёрок?","sol":"Без пятёрок: 8 × 9 × 9 = 648. 900 − 648 = <b>252</b>.","lvl":3,"tag":5},{"q":"Сколько всего прямоугольников на рисунке (квадраты тоже считаются)?","type":"num","ans":36,"hint":"Прямоугольник задают 2 из 4 вертикальных линий и 2 из 4 горизонтальных.","sol":"Пар вертикальных линий 6, горизонтальных 6. 6 × 6 = <b>36</b>.","lvl":2,"fig":"b_grid3","tag":4},{"q":"Муравей ползёт по линиям из A в B только вправо или вверх. Через узел с крестиком проходить нельзя. Сколько у него путей?","type":"num","ans":8,"hint":"Пиши числа в узлах, а в узле с крестиком ставь 0.","sol":"Ряды снизу: 1,1,1,1 → 1,0,1,2 → 1,1,2,4 → 1,2,4,<b>8</b>.","lvl":3,"fig":"b_routesX","tag":4},{"q":"Сколькими способами можно выбрать двух дежурных из 6 учеников?","type":"num","ans":15,"hint":"Роли одинаковые.","sol":"6 × 5 : 2 = <b>15</b>.","lvl":2,"tag":6},{"q":"А сколькими способами можно выбрать из тех же 6 учеников командира и его помощника?","type":"num","ans":30,"hint":"Роли разные — порядок важен.","sol":"6 × 5 = <b>30</b>.","lvl":3,"tag":6}],"w6":[{"q":"У Айсулуу и Бермет вместе 56 наклеек. У Айсулуу на 12 больше. Сколько наклеек у Бермет?","type":"num","ans":22,"hint":"Убери разницу.","sol":"(56 − 12) : 2 = <b>22</b>.","lvl":1,"tag":0},{"q":"Отец старше сына в 4 раза. Вместе им 45 лет. Сколько лет сыну?","type":"num","ans":9,"hint":"Сын — 1 часть, отец — 4 части.","sol":"5 частей = 45, 1 часть = <b>9</b>.","lvl":1,"tag":1},{"q":"В корзине яблок в 3 раза больше, чем груш, и на 24 больше. Сколько груш?","type":"num","ans":12,"hint":"Разница — это сколько частей?","sol":"3 − 1 = 2 части = 24, груш <b>12</b>.","lvl":2,"tag":1},{"q":"У трёх братьев 60 орехов. У старшего на 10 больше, чем у среднего, у среднего на 10 больше, чем у младшего. Сколько у младшего?","type":"num","ans":10,"hint":"Нарисуй три отрезка от младшего. Сколько «хвостиков» всего?","sol":"Хвостики: у среднего 10, у старшего 20 — итого 30. (60 − 30) : 3 = <b>10</b>.","lvl":2,"tag":0},{"q":"Если Арген отдаст Бекзату 5 орехов, орехов у них станет поровну. На сколько у Аргена больше, чем у Бекзата?","type":"num","ans":10,"hint":"Арген теряет 5, а Бекзат получает 5.","sol":"Отдав 5, Арген станет на 5 беднее, а Бекзат на 5 богаче — разница сократится на 10. Значит, было на <b>10</b> больше.","lvl":2,"tag":0},{"q":"Бекжан потратил половину денег на книгу, потом 50 сом на сок, и у него осталось 100 сом. Сколько денег было сначала?","type":"num","ans":300,"hint":"С конца: до сока было 100 + 50.","sol":"До сока: 150. Это половина — всего было 150 × 2 = <b>300</b> сом.","lvl":2,"tag":2},{"q":"На дереве сидели вороны. Половина улетела, потом прилетели 3, потом половина оставшихся улетела, и осталось 5. Сколько ворон было сначала?","type":"num","ans":14,"hint":"Иди с конца: перед последним «улетела половина» было 5 × 2.","sol":"5 × 2 = 10, 10 − 3 = 7, 7 × 2 = <b>14</b>.","lvl":3,"tag":2},{"q":"Во дворе куры и кролики: 35 голов и 94 ноги. Сколько кур?","type":"num","ans":23,"hint":"Предположи, что все — куры.","sol":"Все куры: 70 ног, не хватает 24 → кроликов 12. Кур 35 − 12 = <b>23</b>.","lvl":2,"tag":3},{"q":"В комнате 15 стульев и табуреток. У стула 4 ножки, у табуретки 3. Всего 52 ножки. Сколько табуреток?","type":"num","ans":8,"hint":"Предположи, что все — табуретки.","sol":"Все табуретки: 45 ножек, лишних 7 → стульев 7. Табуреток 15 − 7 = <b>8</b>.","lvl":2,"tag":3},{"q":"В викторине 10 вопросов. За верный ответ дают 5 очков, за неверный снимают 3. Тимур ответил на все и набрал 34 очка. Сколько верных ответов?","type":"num","ans":8,"hint":"Если все верные — 50 очков. Сколько теряется на каждой ошибке?","sol":"Каждая ошибка: вместо +5 стало −3, потеря 8 очков. 50 − 34 = 16, ошибок 2. Верных <b>8</b>.","lvl":3,"tag":3},{"q":"3 тетради и 2 ручки стоят 110 сом, а 3 тетради и 5 ручек — 170 сом. Сколько стоит ручка?","type":"num","ans":20,"hint":"Чем отличаются две покупки?","sol":"Разница — 3 ручки, они стоят 170 − 110 = 60 сом. Ручка <b>20</b> сом.","lvl":3,"tag":0},{"q":"Бревно распилили на 8 частей за 21 минуту. Сколько минут занимает один распил?","type":"num","ans":3,"hint":"Сколько распилов?","sol":"Распилов 7, 21 : 7 = <b>3</b> минуты.","lvl":2,"tag":4},{"q":"Вдоль дорожки длиной 100 м поставили столбы через каждые 10 м, включая начало и конец. Сколько столбов?","type":"num","ans":11,"hint":"Промежутков 10. А столбов?","sol":"Промежутков 10, столбов на 1 больше: <b>11</b>.","lvl":2,"tag":4},{"q":"С 1-го на 4-й этаж — 54 ступеньки, между этажами ступенек поровну. На какой этаж приведут 126 ступенек с 1-го?","type":"num","ans":8,"hint":"С 1-го на 4-й — 3 пролёта.","sol":"Один пролёт 54 : 3 = 18. 126 : 18 = 7 пролётов → 1 + 7 = <b>8</b>-й этаж.","lvl":3,"tag":4},{"q":"Сейчас маме 32 года, а дочке 8. Через сколько лет мама будет старше дочки в 3 раза?","type":"num","ans":4,"hint":"Разница в возрасте не меняется: 24 года. Сколько это частей?","sol":"Когда мама в 3 раза старше, разница — 2 части = 24, дочке 12. 12 − 8 = <b>4</b> года.","lvl":3,"tag":1},{"q":"Через 5 лет Асель будет вдвое старше, чем была 5 лет назад. Сколько ей сейчас?","type":"num","ans":15,"hint":"От «5 лет назад» до «через 5 лет» — 10 лет.","sol":"Возраст «через 5 лет» — 2 части, «5 лет назад» — 1 часть. Разница 1 часть = 10 лет. Тогда было 10, сейчас <b>15</b>.","lvl":3,"tag":1},{"q":"У Айбека в 2 раза больше марок, чем у Бека. Если Айбек отдаст Беку 6 марок, станет поровну. Сколько марок у Бека?","type":"num","ans":12,"hint":"Разница сейчас — 12 марок. А ещё она равна одной «части».","sol":"Разница 12 и равна марок Бека (2 части − 1 часть). У Бека <b>12</b>.","lvl":2,"tag":5},{"q":"Трём братьям вместе 33 года. Старший старше среднего на 3 года, средний старше младшего на 3 года. Сколько лет младшему?","type":"num","ans":8,"hint":"Хвостики: 3 и 6.","sol":"(33 − 3 − 6) : 3 = <b>8</b>.","lvl":2,"tag":5},{"q":"5 ручек и 3 карандаша стоят 260 сом. Ручка дороже карандаша на 20 сом. Сколько стоит карандаш?","type":"num","ans":20,"hint":"Если бы ручки стоили как карандаши, сколько бы стоила покупка?","sol":"260 − 5 × 20 = 160 — это 8 карандашей. Карандаш <b>20</b> сом.","lvl":3,"tag":5},{"q":"Кирпич весит 2 кг и ещё полкирпича. Сколько весит кирпич (в кг)?","type":"num","ans":4,"hint":"Полкирпича + 2 кг = целый кирпич. Значит, 2 кг — это…","sol":"2 кг — вторая половина кирпича. Кирпич <b>4</b> кг.","lvl":2,"tag":7},{"q":"Бабушка испекла пирожки. Внук съел половину и ещё 1, внучка — половину остатка и ещё 1. Осталось 2 пирожка. Сколько было?","type":"num","ans":14,"hint":"С конца: 2 + 1 = 3 — это половина остатка.","sol":"(2 + 1) × 2 = 6 — после внука. (6 + 1) × 2 = <b>14</b>.","lvl":3,"tag":7},{"q":"Мама старше сына на 28 лет. Через 3 года она будет старше его в 5 раз. Сколько лет сыну сейчас?","type":"num","ans":4,"hint":"Разница не меняется. «В 5 раз старше» — разница 4 части.","sol":"4 части = 28, часть = 7 — столько сыну через 3 года. Сейчас <b>4</b>.","lvl":3,"tag":5},{"q":"Мастер делает 12 деталей в час, ученик — 8. За сколько часов вместе они сделают 100 деталей?","type":"num","ans":5,"hint":"Сложи скорости.","sol":"20 деталей в час, 100 : 20 = <b>5</b> часов.","lvl":2,"tag":6},{"q":"Одна труба наполняет бассейн за 6 часов, другая — за 3 часа. За сколько часов наполнят бассейн обе трубы вместе?","type":"num","ans":2,"hint":"Сколько бассейнов наполнит каждая труба за 6 часов?","sol":"За 6 часов: первая — 1 бассейн, вторая — 2. Вместе 3 бассейна за 6 часов, один — за <b>2</b> часа.","lvl":3,"tag":6},{"q":"В 4 одинаковых коробках и 3 одинаковых пакетах 58 конфет. В 2 таких же коробках и 3 пакетах — 38 конфет. Сколько конфет в одном пакете?","type":"num","ans":6,"hint":"Чем отличаются два набора?","sol":"2 коробки = 20, коробка 10. 3 пакета = 38 − 20 = 18, пакет <b>6</b>.","lvl":2,"tag":5},{"q":"В гараже машины (4 колеса) и мотоциклы (2 колеса), всего 18 штук и 56 колёс. Сколько мотоциклов?","type":"num","ans":8,"hint":"Предположи, что все — мотоциклы.","sol":"Все мотоциклы: 36 колёс. Лишние 20 — по 2 у каждой машины: 10 машин. Мотоциклов <b>8</b>.","lvl":2,"tag":5},{"q":"Купили 10 тетрадей по 12 сом и по 15 сом и заплатили 135 сом. Сколько тетрадей по 15 сом?","type":"num","ans":5,"hint":"Если бы все были по 12 сом…","sol":"Все по 12: 120. Лишние 15 сом, каждая дорогая +3: 15 : 3 = <b>5</b>.","lvl":3,"tag":5},{"q":"Если ученики сядут по 2 за парту, 3 ученикам не хватит места. Если по 3 — одна парта останется пустой. Сколько учеников?","type":"num","ans":15,"hint":"Сравни: по 3 за все парты, кроме одной.","sol":"Пусть парт n: 2n + 3 = 3(n − 1). Отсюда n = 6, учеников 2 × 6 + 3 = <b>15</b>.","lvl":3,"tag":5}],"w7":[{"q":"Периметр прямоугольника 30 см, длина 9 см. Чему равна ширина (в см)?","type":"num","ans":6,"hint":"Длина + ширина — это половина периметра.","sol":"30 : 2 = 15, 15 − 9 = <b>6</b> см.","lvl":1,"tag":0},{"q":"Площадь квадрата 49 см². Найди его периметр (в см).","type":"num","ans":28,"hint":"Сторона × сторона = 49.","sol":"Сторона 7, периметр 4 × 7 = <b>28</b> см.","lvl":1,"tag":1},{"q":"Крестик сложен из 5 квадратов со стороной 2 см. Найди его периметр (в см).","type":"num","ans":24,"hint":"Сколько сторон маленького квадрата на краю крестика?","sol":"На краю 12 сторон по 2 см: <b>24</b> см.","lvl":2,"fig":"a_cross","tag":0},{"q":"Лесенка сложена из 6 квадратов со стороной 1 см. Найди её периметр (в см).","type":"num","ans":12,"hint":"Вспомни урок: «выпрями» ступеньки.","sol":"Как у квадрата 3 × 3: <b>12</b> см.","lvl":2,"fig":"a_stairs","tag":0},{"q":"Полоска из трёх одинаковых квадратов имеет периметр 24 см. Найди её площадь (в см²).","type":"num","ans":27,"hint":"Сколько сторон маленького квадрата на краю?","sol":"8 сторон: 24 : 8 = 3 см. Площадь 3 × 9 = <b>27</b> см².","lvl":2,"fig":"a_strip3","tag":1},{"q":"Из квадрата 5 × 5 клеток вырезали угол 2 × 2. Сколько клеток осталось?","type":"num","ans":21,"hint":"Вычти.","sol":"25 − 4 = <b>21</b>.","lvl":1,"fig":"a_lshape","tag":1},{"q":"Та же фигура, клетка 1 × 1 см. Чему равен её периметр (в см)?","type":"num","ans":20,"hint":"Сравни с периметром целого квадрата. Изменился ли он, когда вырезали угол?","sol":"Две стороны, ушедшие внутрь при вырезании, заменились такими же новыми. Периметр как у квадрата 5 × 5: <b>20</b> см.","lvl":3,"fig":"a_lshape","tag":0},{"q":"Два квадрата со стороной 4 см приложили друг к другу сторонами. Найди периметр получившейся фигуры (в см).","type":"num","ans":24,"hint":"Сумма периметров минус две общие стороны.","sol":"16 + 16 − 2 × 4 = <b>24</b> см.","lvl":2,"tag":2},{"q":"Квадрат разрезали на 2 одинаковых прямоугольника. Периметр каждого 18 см. Найди площадь квадрата (в см²).","type":"num","ans":36,"hint":"Длина прямоугольника — сторона квадрата, ширина — половина стороны.","sol":"Периметр = 3 стороны квадрата = 18, сторона 6, площадь <b>36</b> см².","lvl":2,"tag":2},{"q":"Квадрат разрезали на 4 одинаковые полоски-прямоугольника. Периметр каждой полоски 20 см. Найди площадь квадрата (в см²).","type":"num","ans":64,"hint":"Полоска: длина — сторона квадрата, ширина — четверть стороны. Сколько «четвертей» в периметре?","sol":"Периметр полоски = 2 стороны + 2 четверти = 2,5 стороны = 10 четвертей = 20 см. Четверть 2 см, сторона 8 см, площадь <b>64</b> см².","lvl":3,"tag":2},{"q":"Прямоугольник с периметром 20 см разрезали прямой линией на два прямоугольника. Сумма их периметров 28 см. Какой длины разрез (в см)?","type":"num","ans":4,"hint":"Откуда взялись лишние 8 см?","sol":"Разрез вошёл в оба новых периметра: 28 − 20 = 8 = 2 × разрез. Разрез <b>4</b> см.","lvl":3,"tag":2},{"q":"Из клетчатого прямоугольника 8 × 5 клеток вырезают квадраты 2 × 2 по линиям. Какое наибольшее число квадратов можно вырезать?","type":"num","ans":8,"hint":"Сколько поместится вдоль 8? Вдоль 5?","sol":"4 × 2 = <b>8</b> (одна полоска шириной 1 останется).","lvl":2,"tag":1},{"q":"Куб 3 × 3 × 3 покрасили снаружи и распилили на 27 кубиков. Сколько кубиков окрашено ровно с двух сторон?","type":"num","ans":12,"hint":"Они на рёбрах, но не в углах.","sol":"12 рёбер, на каждом 1 такой кубик: <b>12</b>.","lvl":2,"tag":3},{"q":"Куб 4 × 4 × 4 покрасили снаружи и распилили на 64 кубика. Сколько кубиков совсем не окрашено?","type":"num","ans":8,"hint":"Внутри спрятан куб поменьше. Какого размера?","sol":"Внутри куб 2 × 2 × 2 = <b>8</b> кубиков.","lvl":3,"tag":3},{"q":"В том же кубе 4 × 4 × 4: сколько кубиков окрашено ровно с одной стороны?","type":"num","ans":24,"hint":"На каждой грани в середине — квадрат 2 × 2.","sol":"На каждой из 6 граней по 4 кубика: 6 × 4 = <b>24</b>.","lvl":3,"tag":3},{"q":"Куб 5 × 5 × 5 покрасили и распилили на кубики 1 × 1 × 1. Сколько кубиков окрашено с трёх сторон?","type":"num","ans":8,"hint":"Где стоят кубики с тремя окрашенными гранями?","sol":"Только в углах, а углов у любого куба 8: <b>8</b>.","lvl":3,"tag":3},{"q":"Найди площадь закрашенного треугольника (в клетках).","type":"num","ans":12,"hint":"Это половина прямоугольника 6 × 4.","sol":"6 × 4 : 2 = <b>12</b>.","lvl":2,"fig":"b_tri","tag":4},{"q":"Из квадрата 4 × 4 клетки отрезали уголок — половину квадрата 2 × 2. Какова площадь закрашенной фигуры (в клетках)?","type":"num","ans":14,"hint":"Половина квадрата 2 × 2 — сколько клеток?","sol":"16 − 2 = <b>14</b>.","lvl":2,"fig":"b_cut","tag":4},{"q":"Площадь прямоугольника 48 см², одна сторона 6 см. Найди периметр (в см).","type":"num","ans":28,"hint":"Сначала вторую сторону.","sol":"48 : 6 = 8. (6 + 8) × 2 = <b>28</b> см.","lvl":2,"tag":6},{"q":"Квадрат с периметром 36 см разрезали на 9 одинаковых квадратиков. Найди периметр одного квадратика (в см).","type":"num","ans":12,"hint":"9 квадратиков — это 3 × 3.","sol":"Сторона 9 см, квадратик со стороной 3 см, периметр <b>12</b> см.","lvl":3,"tag":6},{"q":"Прямоугольник 6 × 4 см разрезали на квадраты 2 × 2 см. Чему равна сумма периметров всех квадратов (в см)?","type":"num","ans":48,"hint":"Сколько получилось квадратов?","sol":"3 × 2 = 6 квадратов, по 8 см: <b>48</b> см.","lvl":3,"tag":6},{"q":"Квадрат со стороной 10 см разрезали на два прямоугольника. Периметр одного из них 26 см. Найди периметр второго (в см).","type":"num","ans":34,"hint":"У первого длина 10, а ширина?","sol":"10 + ширина = 13 → ширина 3. Второй: 10 × 7, периметр <b>34</b> см.","lvl":3,"tag":6},{"q":"Лесенка из кубиков: столбики высотой 1, 2, 3 и 4 кубика. Сколько всего кубиков?","type":"num","ans":10,"hint":"Сложи.","sol":"1 + 2 + 3 + 4 = <b>10</b>.","lvl":1,"tag":5},{"q":"Пирамида из кубиков: верхний слой — 1 кубик, второй — квадрат 2 × 2, третий — 3 × 3. Сколько всего кубиков?","type":"num","ans":14,"hint":"Посчитай слои.","sol":"1 + 4 + 9 = <b>14</b>.","lvl":2,"tag":5},{"q":"Из куба 3 × 3 × 3 вынули все угловые кубики. Сколько кубиков осталось?","type":"num","ans":19,"hint":"Сколько углов у куба?","sol":"27 − 8 = <b>19</b>.","lvl":3,"tag":5},{"q":"Брусок 2 × 3 × 4 покрасили снаружи и распилили на кубики 1 × 1 × 1. Сколько кубиков окрашено ровно с одной стороны?","type":"num","ans":4,"hint":"Ищи середины граней. У граней с толщиной 2 серединок нет.","sol":"Только две большие грани 3 × 4 имеют серединки размером 1 × 2 — по 2 кубика. Итого <b>4</b>.","lvl":3,"tag":
